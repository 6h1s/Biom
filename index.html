<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Biom">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Biom</title>
<style>
:root{
  --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --sep:rgba(84,84,88,.6);
  --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --move:#fa114f; --exercise:#a6ff00; --stand:#00f0ff;
  --activity:#ff9f0a; --heart:#ff375f; --sleep:#5ac8fa; --body:#bf5af2; --resp:#64d2ff;
  --time:#ffd60a; --dist:#64d2ff; --gym:#30d158; --blue:#0a84ff;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit}
#app{max-width:640px;margin:0 auto;padding:calc(var(--safe-t) + 8px) 16px calc(var(--safe-b) + 96px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 0 14px}
.eyebrow{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
h1{font-size:34px;font-weight:700;letter-spacing:.01em;margin:2px 0 0}
h2{font-size:22px;font-weight:700;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:17px;font-weight:400;color:var(--move)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--label2)}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.tap{cursor:pointer;transition:transform .12s, opacity .12s}
.tap:active{transform:scale(.98);opacity:.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{margin:0}
.ct{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600}
.ct .chev{color:var(--label3);font-weight:400}
.big{font-family:var(--round);font-weight:600;font-size:30px;letter-spacing:-.01em;line-height:1.1}
.big .u{font-size:15px;font-weight:600;margin-left:2px;text-transform:uppercase}
.mid{font-family:var(--round);font-weight:600;font-size:22px}
.mid .u{font-size:13px;font-weight:600;margin-left:1px;text-transform:uppercase}
.sub{font-size:13px;color:var(--label2)}
.muted{color:var(--label2)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ringstats .stat{margin-bottom:6px}
.ringstats .lbl{font-size:15px;font-weight:600}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--sep)}
.list .item:last-child{border-bottom:0}
.wicon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.wicon svg{width:24px;height:24px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.statgrid .k{font-size:15px;color:var(--label)}
.seg{display:flex;background:var(--card2);border-radius:9px;padding:2px;margin:6px 0 14px}
.seg button{flex:1;padding:6px 0;font-size:13px;font-weight:600;border-radius:7px;color:var(--label)}
.seg button.on{background:#636366}
.nav{display:flex;align-items:center;justify-content:space-between;height:44px;margin:0 -4px}
.back{color:var(--blue);display:flex;align-items:center;gap:2px;font-size:17px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(22,22,24,.82);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-top:.5px solid var(--sep);padding:6px 0 calc(var(--safe-b) + 6px)}
.tabbar .in{max-width:640px;margin:0 auto;display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:#8e8e93}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--move)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card2);color:var(--label2)}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--card2);font-weight:600;text-align:center;margin-top:8px}
.btn.primary{background:var(--move);color:#fff}
.btn.danger{color:var(--heart)}
.field{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:.5px solid var(--sep);gap:12px}
.field:last-child{border-bottom:0}
.field input,.field select{background:transparent;border:0;color:var(--label2);text-align:right;min-width:0;flex:1;outline:none;-webkit-appearance:none;appearance:none}
.field select option{color:#000}
.empty{color:var(--label2);text-align:center;padding:24px 8px;font-size:15px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:10px;fill:var(--label2)}
.zone{display:grid;grid-template-columns:62px 1fr 54px;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.zone .bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.zone .bar i{display:block;height:100%;border-radius:4px}
table.splits{width:100%;border-collapse:collapse;font-size:15px}
table.splits th{font-size:12px;color:var(--label2);font-weight:600;text-align:left;padding:4px 0}
table.splits td{padding:8px 0;border-top:.5px solid var(--sep);font-family:var(--round);font-weight:600}
.trend{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--sep)}
.trend:last-child{border-bottom:0}
.arrow{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.setrow{display:flex;justify-content:space-between;padding:7px 0;border-top:.5px solid var(--sep);font-size:15px}
.setrow .del{color:var(--heart);font-size:13px;margin-left:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 84px);background:rgba(44,44,46,.96);
  padding:10px 16px;border-radius:14px;font-size:15px;z-index:20;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--label2);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.week{display:flex;justify-content:space-between;margin-top:12px}
.week div{text-align:center;font-size:11px;color:var(--label2);font-weight:600}
.banner{background:var(--card2);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.info{display:inline-grid;place-items:center;width:22px;height:22px;color:var(--blue);vertical-align:middle;margin-left:6px;flex:none}
.info svg{width:20px;height:20px}
h2 .info{margin-left:8px}
.h2l{display:flex;align-items:center}
.rangecap{margin:-6px 2px 12px;line-height:1.4}
.vrow{padding:9px 0;border-top:.5px solid var(--sep)}
.vbar{position:relative;height:8px;margin:9px 0 5px;background:var(--card2);border-radius:4px}
.vbar .rng{position:absolute;top:0;bottom:0;background:#636366;border-radius:4px}
.vbar .dot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--card)}
.hb{margin-top:12px}
.hb .track{height:22px;border-radius:6px;margin:4px 0 3px}
.dots{display:inline-flex;gap:3px;margin-right:6px;vertical-align:1px}
.dots i{width:8px;height:8px;border-radius:50%}
.ctx{padding:10px 0;border-bottom:.5px solid var(--sep)}
.ctx:last-child{border-bottom:0}
.ci{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ci svg{width:20px;height:20px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#1c1c1e;width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:14px 14px 0 0;padding:8px 20px calc(var(--safe-b) + 24px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:#48484a;margin:0 auto 10px}
.sheet h3{font-size:20px;font-weight:700;margin:6px 0}
.sheet .done{color:var(--blue);font-weight:600}
.sheet-body{font-size:15px;line-height:1.5;color:rgba(235,235,245,.85)}
.sheet-body p{margin:10px 0}
.sheet-body dl{margin:10px 0}
.sheet-body dt{font-weight:600;color:#fff;margin-top:10px}
.sheet-body dd{margin:2px 0 0}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{animation:none}}
@media (min-width:700px){ #app{padding-top:24px} }
</style>
</head>

/* ============================================================ storage */
const DB_NAME = "pulse", STORE = "kv";
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open(DB_NAME, 1);
  r.onupgradeneeded = () => r.result.createObjectStore(STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function dbGet(k){ try { const db = await idb(); return await new Promise((res, rej) => { const t = db.transaction(STORE).objectStore(STORE).get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); } catch(e){ console.warn(e); return null; } }
async function dbSet(k, v){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }

function blankState(){ return { profile:{}, settings:{}, days:{}, workouts:{}, sets:{}, deletedSets:{}, meta:{created:new Date().toISOString()} }; }
let S = blankState();
/* Preview mode: a review copy with data baked in, kept in memory only (never saved) */
const PREVIEW = window.BIOM_PREVIEW || null;
async function load(){
  if (PREVIEW) { S = blankState(); if (PREVIEW.baseline) importJSON(PREVIEW.baseline); if (PREVIEW.gymlog) importGymlog(PREVIEW.gymlog); S.meta.lastBackup = new Date().toISOString(); return; }
  const v = await dbGet("state"); if (v && v.days) S = Object.assign(blankState(), v); }
let saveTimer; function save(){ if (PREVIEW) return; clearTimeout(saveTimer); saveTimer = setTimeout(() => dbSet("state", S).catch(e => toast("Could not save: " + e.message)), 150); }

/* ============================================================ helpers */
const $ = s => document.querySelector(s);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function dkey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function pday(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(k, n){ const d = pday(k); d.setDate(d.getDate()+n); return dkey(d); }
const TODAY = () => dkey(new Date());
function num(v, dp=0){ if (v==null || isNaN(v)) return "–"; return Number(v).toLocaleString(undefined, {minimumFractionDigits:dp, maximumFractionDigits:dp}); }
function hm(min){ if (min==null) return "–"; min = Math.round(min); const h = Math.floor(min/60), m = min%60; return h ? `${h}<span class="u">h</span> ${m}<span class="u">min</span>` : `${m}<span class="u">min</span>`; }
function hmPlain(min){ min = Math.round(min||0); const h = Math.floor(min/60), m = min%60; return h ? `${h}h ${m}min` : `${m}min`; }
function clock(sec){ sec = Math.round(sec||0); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`; }
function pace(secPerKm){ if (!secPerKm || !isFinite(secPerKm)) return "–"; const m = Math.floor(secPerKm/60), s = Math.round(secPerKm%60); return `${m}'${String(s===60?0:s).padStart(2,"0")}"`; }
function fmtDate(k, opt={weekday:"long", day:"numeric", month:"long"}){ return pday(k).toLocaleDateString("en-GB", opt); }
function relDay(k){ const t = TODAY(); if (k===t) return "Today"; if (k===addDays(t,-1)) return "Yesterday";
  const diff = (pday(t)-pday(k))/864e5; if (diff < 7) return pday(k).toLocaleDateString("en-GB",{weekday:"long"});
  return pday(k).toLocaleDateString("en-GB",{day:"numeric",month:"short", year: pday(k).getFullYear()!==new Date().getFullYear() ? "numeric" : undefined}); }
function timeOf(iso){ return new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function age(){ const dob = S.profile.dob; if (!dob) return null; const b = pday(dob), n = new Date(); let a = n.getFullYear()-b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; }
function maxHr(){ return +S.settings.maxHr || (age() ? Math.round(208 - 0.7*age()) : 190); }
function restHr(){ if (+S.settings.restHr) return +S.settings.restHr; const v = series("rhr", 30).map(x=>x.v).filter(x=>x!=null); return v.length ? Math.round(avg(v)) : 60; }
function avg(a){ a = a.filter(x => x!=null && !isNaN(x)); return a.length ? a.reduce((s,x)=>s+x,0)/a.length : null; }
function sum(a){ return a.reduce((s,x)=>s+(x||0),0); }
function metricVal(key, dayKey){ const d = S.days[dayKey]; if (!d) return null; const v = METRICS[key].get(d); return v==null || isNaN(v) ? null : +v; }
function series(key, n, end=TODAY()){ const out = []; for (let i=n-1; i>=0; i--){ const k = addDays(end,-i); out.push({k, v:metricVal(key,k)}); } return out; }
function latest(key, within=3650){ const keys = Object.keys(S.days).sort(); for (let i=keys.length-1; i>=0; i--){ const v = metricVal(key, keys[i]); if (v!=null) { if ((pday(TODAY())-pday(keys[i]))/864e5 > within) return null; return {k:keys[i], v}; } } return null; }

/* ============================================================ import / merge */
function mergeDay(k, nd){
  const od = S.days[k] || (S.days[k] = {});
  for (const [f, v] of Object.entries(nd)){
    if (v == null) continue;
    if (f === "rings" && od.rings) od.rings = Object.assign({}, od.rings, Object.fromEntries(Object.entries(v).filter(([,x])=>x!=null)));
    else od[f] = v;

}
function mergeWorkout(w){
  if (!w.id) w.id = `${w.rawType||w.type}-${String(w.start).slice(0,16)}`;
  const o = S.workouts[w.id];
  if (!o) { S.workouts[w.id] = w; return 1; }
  for (const [f, v] of Object.entries(w)) if (v != null && !(Array.isArray(v) && !v.length && o[f]?.length)) o[f] = v;
  return 0;
}
function importJSON(obj, label){

  if (obj.profile) for (const [k,v] of Object.entries(obj.profile)) if (v!=null && (S.profile[k]==null || obj.kind!=="baseline" || k==="weightKg")) S.profile[k] = v;
  if (obj.kind === "backup") { if (obj.settings) S.settings = Object.assign({}, obj.settings, S.settings); if (obj.deletedSets) Object.assign(S.deletedSets, obj.deletedSets); }
  if (obj.days) for (const [k, d] of Object.entries(obj.days)) { mergeDay(k, d); nd++; }
  if (obj.workouts) for (const w of (Array.isArray(obj.workouts) ? obj.workouts : Object.values(obj.workouts))) nw += mergeWorkout(Object.assign({}, w));
  if (obj.sets) for (const s of (Array.isArray(obj.sets) ? obj.sets : Object.values(obj.sets))) if (!S.sets[s.id] && !S.deletedSets[s.id]) { S.sets[s.id] = s; ns++; }
  if (typeof obj.gymlog === "string") ns += importGymlog(obj.gymlog);
  if (typeof obj.health === "string") { const r = importHealthLines(obj.health); nd += r.days; nw += r.workouts; }
  S.meta.lastImport = new Date().toISOString();
  save();
  return `${label||"Imported"}: ${nd ? num(nd)+" days" : ""}${nw ? (nd?", ":"")+nw+" new workouts" : ""}${ns ? ((nd||nw)?", ":"")+ns+" new sets" : ""}`.replace(/: $/, ": nothing new");
}
/* Gym log lines written by the Watch: DATE ; EXERCISE ; REPS ; KG   (DATE = 2026-11-08 or ISO with time) */
function parseGymLine(line){
  const p = line.split(";").map(x => x.trim());
  if (p.length < 3 || !/^\d{4}-\d{2}-\d{2}/.test(p[0])) return null;
  const reps = parseFloat(String(p[2]).replace(",", ".")), kg = parseFloat(String(p[3]??"0").replace(",", "."));
  if (!p[1] || isNaN(reps)) return null;
  return { date:p[0].slice(0,10), time: p[0].length > 10 ? p[0] : null, ex:p[1], reps, kg:isNaN(kg)?0:kg };
}
function importGymlog(text){
  let added = 0; const seen = {};
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    const s = parseGymLine(line); if (!s) continue;
    const base = `${s.time||s.date}|${norm(s.ex)}|${s.reps}|${s.kg}`;
    seen[base] = (seen[base]||0) + 1;           // identical sets on the same day stay distinct
    const id = "w|" + base + "|" + seen[base];
    if (S.sets[id] || S.deletedSets[id]) continue;
    S.sets[id] = Object.assign({id, src:"watch"}, s); added++;
  }
  return added;
}
/* Health lines from the Sync shortcut:

     workout;Walking;START;END;minutes;km;kcal;avgHr
     hr;132;TIMESTAMP                 heart-rate sample (attached to the workout it falls in)                */
const HKEY = {steps:"steps", distance:"distKm", active:"activeKcal", exercise:"exerciseMin", flights:"flights", rhr:"rhr", hrv:"hrv",
  walkhr:"walkHr", weight:"weight", resp:"respRate", vo2:"vo2", daylight:"daylightMin", stand:"standHours", basal:"basalKcal"};
const RAWTYPE = {running:"run", walking:"walk", cycling:"cycle", hiking:"hike", "traditional strength training":"strength", traditionalstrengthtraining:"strength",
  "functional strength training":"functional", functionalstrengthtraining:"functional", "high intensity interval training":"hiit", highintensityintervaltraining:"hiit",
  "core training":"core", coretraining:"core", yoga:"yoga", swimming:"swim", elliptical:"elliptical", rowing:"rowing", "cross training":"cross", crosstraining:"cross", cooldown:"cooldown"};
function numLoose(x){ if (x==null) return null; const v = parseFloat(String(x).replace(",", ".").replace(/[^\d.\-]/g, "")); return isNaN(v) ? null : v; }
function importHealthLines(text){

  for (const raw of String(text).split(/\r?\n/)) {
    const p = raw.split(";").map(x => x.trim()); if (p.length < 3) continue;
    const key = p[0].toLowerCase();
    if (HKEY[key]) { const k = p[2].slice(0,10), v = numLoose(p[1]); if (v==null || !/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
      mergeDay(k, {[HKEY[key]]: key==="distance" && v > 200 ? v/1000 : v}); days.add(k); }
    else if (key === "sleep" && p.length >= 4) { const s = new Date(p[2]), e = new Date(p[3]); if (isNaN(s)||isNaN(e)) continue;
      const night = dkey(e.getHours() < 18 ? e : new Date(e.getTime()+864e5)); (sleepByNight[night] ||= []).push([s, e, p[1].toLowerCase()]); }
    else if (key === "workout" && p.length >= 5) { const s = new Date(p[2]), e = new Date(p[3]); if (isNaN(s)) continue;
      const rt = p[1].replace(/^HKWorkoutActivityType/,""); const type = RAWTYPE[rt.toLowerCase()] || "other";
      const w = { rawType: rt.replace(/\s/g,""), type, start: s.toISOString(), end: isNaN(e)?null:e.toISOString(),
        durationMin: numLoose(p[4]) ?? (isNaN(e)?null:(e-s)/6e4), distanceKm: numLoose(p[5]), activeKcal: numLoose(p[6]), avgHr: numLoose(p[7]), source:"Sync" };
      if (w.distanceKm > 200) w.distanceKm /= 1000;

    for (const [s,e,st] of recs) { const k = map[st] || (st.includes("deep")?"deep":st.includes("rem")?"rem":st.includes("core")?"core":st.includes("awake")?"awake":st.includes("bed")?"inBed":"asleep");
      agg[k] = (agg[k]||0) + (e-s)/6e4; if (k!=="inBed") stages.push([s.toISOString(), +((e-s)/6e4).toFixed(1), k]); }
    const asleep = (agg.core||0)+(agg.deep||0)+(agg.rem||0)+(agg.asleep||0);
    const sl = Object.fromEntries(Object.entries(agg).map(([k,v])=>[k,Math.round(v)]));
    if (asleep) sl.asleepMin = Math.round(asleep); sl.start = recs[0][0].toISOString(); sl.end = new Date(Math.max(...recs.map(r=>r[1]))).toISOString(); sl.stages = stages;

    const s = new Date(w.start), e = w.end ? new Date(w.end) : new Date(s.getTime() + (w.durationMin||0)*6e4);
    const seg = hrs.filter(([t]) => t >= s && t <= e).sort((a,b)=>a[0]-b[0]); if (seg.length < 5 || (w.hr && w.hr.length > seg.length)) continue;

}
/* Detect what a piece of text is and import it */
function importText(text, label){
  text = String(text||"").trim(); if (!text) throw new Error("Empty");
  if (text[0] === "{") return importJSON(JSON.parse(text), label);
  const gym = [], health = [];
  for (const l of text.split(/\r?\n/)) (/^\d{4}-\d{2}-\d{2}/.test(l.trim()) ? gym : health).push(l);
  const ns = importGymlog(gym.join("\n")); const r = importHealthLines(health.join("\n"));
  S.meta.lastImport = new Date().toISOString(); save();
  const parts = []; if (r.days) parts.push(r.days + " days"); if (r.workouts) parts.push(r.workouts + " new workouts"); if (ns) parts.push(ns + " new sets");
  return `${label||"Imported"}: ${parts.join(", ") || "nothing new"}`;
}
async function handleFiles(files){
  for (const f of files) {
    try { toast("Reading " + esc(f.name) + "…", 1200); const txt = await f.text(); toast(importText(txt, esc(f.name))); }
    catch(e) { toast("Couldn't import " + esc(f.name) + ": " + esc(e.message), 4000); }
  }
  render();
}
/* Sync payload arrives in the URL after # so it never leaves the phone */
function handleHash(){
  const h = location.hash; if (!h || h.length < 3) return false;
  const m = h.match(/^#(sync|import)=(.*)$/s); if (!m) return false;
  let payload = m[2]; try { payload = decodeURIComponent(payload); } catch(e) {}
  try { history.replaceState(null, "", location.pathname + location.search); } catch(e) {}
  try { const msg = importText(payload, "Synced"); S.meta.lastSync = new Date().toISOString(); save(); setTimeout(()=>toast(msg), 300); }
  catch(e) { setTimeout(()=>toast("Sync failed: " + esc(e.message), 4000), 300); }
  return true;
}
function backup(){
  const data = Object.assign({format:"health-dashboard", version:1, kind:"backup", exported:new Date().toISOString(), app:APP_VERSION}, S);
  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `biom-backup-${TODAY()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  S.meta.lastBackup = new Date().toISOString(); save(); render();
}

/* ============================================================ charts (pure SVG) */
function niceMax(v){ if (!v || v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function axisFmt(v){ return v >= 10000 ? (v/1000).toLocaleString(undefined,{maximumFractionDigits:0})+"k" : v >= 1000 ? (v/1000).toLocaleString(undefined,{maximumFractionDigits:1})+"k" : num(v, v<10 && v%1 ? 1 : 0); }
/* bar chart: items = [{label, v}] */
function barChart(items, color, {h=160, avgLine=null, onTap=null, min0=true, goal=null, spark=false}={}){
  const W = 340, R = spark ? 0 : 30, B = spark ? 1 : 18, T = spark ? 1 : 8, iw = W - R, ih = h - B - T;
  const vals = items.map(i => i.v).filter(v => v != null);
  const mx = niceMax(Math.max(...vals, goal||0, 0) * 1.05);
  const n = items.length, bw = iw / n, barW = Math.max(2, Math.min(22, bw * 0.62));
  let g = "";
  if (!spark) for (let i = 0; i <= 2; i++) { const y = T + ih - ih * i / 2; g += `<line x1="0" x2="${iw}" y1="${y}" y2="${y}" stroke="rgba(235,235,245,.12)" stroke-dasharray="${i?"2 3":""}"/><text x="${W-2}" y="${y+3}" text-anchor="end">${axisFmt(mx*i/2)}</text>`; }
  if (goal) { const y = T + ih - ih*goal/mx; g += `<line x1="0" x2="${iw}" y1="${y}" y2="${y}" stroke="${color}" stroke-opacity=".5" stroke-dasharray="4 3"/>`; }
  const every = Math.ceil(n / 7);
  items.forEach((it, i) => {
    const x = i * bw + (bw - barW) / 2;
    if (it.v != null && it.v > 0) { const bh = Math.max(2, ih * it.v / mx); g += `<rect class="bar" data-i="${i}" x="${x}" y="${T+ih-bh}" width="${barW}" height="${bh}" rx="${Math.min(3, barW/2)}" fill="${color}"/>`; }
    if (it.label && (i % every === 0 || n <= 7)) g += `<text x="${x + barW/2}" y="${h-4}" text-anchor="middle">${esc(it.label)}</text>`;
    if (onTap) g += `<rect data-i="${i}" class="hit" x="${i*bw}" y="0" width="${bw}" height="${h}" fill="transparent"/>`;
  });
  if (avgLine != null) { const y = T + ih - ih*avgLine/mx; g += `<line x1="0" x2="${iw}" y1="${y}" y2="${y}" stroke="#fff" stroke-opacity=".7" stroke-width="1" stroke-dasharray="3 3"/>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" ${onTap?`data-tap="${onTap}"`:""}>${g}</svg>`;
}
/* line chart: pts = [{x, y}], x numeric */
function lineChart(pts, color, {h=150, xLabels=[], area=true, dots=false, yMin=null, yMax=null, bands=null}={}){
  const W = 340, R = 30, B = 18, T = 10, iw = W - R, ih = h - B - T;
  const P = pts.filter(p => p.y != null);
  if (!P.length) return `<div class="empty">No data yet</div>`;
  let lo = yMin ?? Math.min(...P.map(p=>p.y)), hi = yMax ?? Math.max(...P.map(p=>p.y));
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; } const pad = (hi-lo)*0.12; if (yMin==null) lo -= pad; if (yMax==null) hi += pad;
  const x0 = Math.min(...pts.map(p=>p.x)), x1 = Math.max(...pts.map(p=>p.x)) || 1;
  const X = x => (x1===x0 ? iw/2 : (x - x0) / (x1 - x0) * iw), Y = y => T + ih - (y - lo) / (hi - lo) * ih;
  let g = "";
  if (bands) for (const b of bands) { const ya = Y(Math.min(hi,b.to)), yb = Y(Math.max(lo,b.from)); if (yb>ya) g += `<rect x="0" y="${ya}" width="${iw}" height="${yb-ya}" fill="${b.c}" opacity=".10"/>`; }
  for (let i = 0; i <= 2; i++) { const v = lo + (hi-lo)*i/2, y = Y(v); g += `<line x1="0" x2="${iw}" y1="${y}" y2="${y}" stroke="rgba(235,235,245,.12)" stroke-dasharray="${i?"2 3":""}"/><text x="${W-2}" y="${y+3}" text-anchor="end">${num(v, hi-lo<10?1:0)}</text>`; }
  // break the line where there are gaps in data
  const segs = []; let cur = [];
  for (const p of pts) { if (p.y == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push(p); }
  if (cur.length) segs.push(cur);
  const id = "g" + Math.random().toString(36).slice(2,7);
  if (area) g += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
  for (const s of segs) {
    const d = s.map((p,i) => (i?"L":"M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
    if (area && s.length > 1) g += `<path d="${d} L${X(s[s.length-1].x).toFixed(1)} ${T+ih} L${X(s[0].x).toFixed(1)} ${T+ih} Z" fill="url(#${id})"/>`;
    if (s.length > 1) g += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (dots || s.length === 1) for (const p of s) g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="${color}"/>`;
  }
  for (const l of xLabels) g += `<text x="${Math.min(iw-4, Math.max(4, X(l.x)))}" y="${h-4}" text-anchor="${X(l.x) < 10 ? "start" : X(l.x) > iw-10 ? "end" : "middle"}">${esc(l.label)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${h}">${g}</svg>`;
}
/* Activity rings */
function ringsSVG(size, fr, {stroke=null}={}){
  const cols = [["#fa114f","#3e0612"],["#a6ff00","#2c4400"],["#00f0ff","#004447"]];
  const sw = stroke || size * 0.11, gap = sw * 0.12, c = size/2; let g = "";
  fr.forEach((f, i) => {
    const r = c - sw/2 - i*(sw+gap), L = 2*Math.PI*r; f = Math.max(0, f||0);
    g += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${cols[i][1]}" stroke-width="${sw}"/>`;
    const draw = (ff) => `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${cols[i][0]}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${Math.max(0.001,ff)*L} ${L}" transform="rotate(-90 ${c} ${c})"/>`;

/* Sleep stages chart (hypnogram) */
const STAGE = {awake:{n:"Awake",c:"#ff7f66",row:0}, rem:{n:"REM",c:"#3fb8f5",row:1}, core:{n:"Core",c:"#0a84ff",row:2}, deep:{n:"Deep",c:"#5e5ce6",row:3}, asleep:{n:"Asleep",c:"#0a84ff",row:2}};
function hypnogram(sl){

  const s0 = new Date(sl.start).getTime(), e0 = new Date(sl.end).getTime(), span = Math.max(1, e0 - s0);
  const X = t => L + (t - s0) / span * (W - L);
  let g = "";

  for (const [st, min, stage] of sl.stages) { const S2 = STAGE[stage]; if (!S2) continue;
    const a = new Date(st).getTime(), x = X(a), w = Math.max(1.5, X(a + min*6e4) - x);

  return `<svg class="chart" viewBox="0 0 ${W} ${h}">${g}</svg>`;
}

function trendsCard(){

/* ----- Metric detail (Apple Health-style chart with ranges) */
const RANGES = {W:"W", M:"M", "6M":"6M", Y:"Y", All:"All"};
function buckets(key, range){
  const m = METRICS[key], t = TODAY(), out = [];
  const agg = vals => { vals = vals.filter(v=>v!=null); if (!vals.length) return null; return m.agg==="sum" ? avg(vals) : avg(vals); };
  if (range === "W" || range === "M") { const n = range==="W"?7:30;
    for (const x of series(key, n)) out.push({label: range==="W" ? pday(x.k).toLocaleDateString("en-GB",{weekday:"short"}) : String(pday(x.k).getDate()), v:x.v, title:fmtDate(x.k,{weekday:"short",day:"numeric",month:"short"})}); }
  else if (range === "6M") { let start = addDays(t, -7*25 - ((pday(t).getDay()+6)%7));
    for (let i = 0; i < 26; i++) { const ks = []; for (let j=0;j<7;j++) ks.push(addDays(start, i*7+j));
      out.push({label: i%4===0 ? pday(ks[0]).toLocaleDateString("en-GB",{month:"short"}) : "", v: agg(ks.map(k=>metricVal(key,k))), title:"Week of " + fmtDate(ks[0],{day:"numeric",month:"short"})}); } }
  else if (range === "Y") { const now = new Date();
    for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth()-i, 1); const ks = []; const dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      for (let j=1;j<=dim;j++) ks.push(dkey(new Date(d.getFullYear(), d.getMonth(), j)));
      out.push({label: d.toLocaleDateString("en-GB",{month:"narrow"}), v: agg(ks.map(k=>metricVal(key,k))), title:d.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}); } }
  else { const keys = Object.keys(S.days).sort(); const y0 = keys.length ? +keys[0].slice(0,4) : new Date().getFullYear(); const by = {};
    for (const k of keys) { const v = metricVal(key,k); if (v!=null) (by[k.slice(0,4)] ||= []).push(v); }
    for (let y = y0; y <= new Date().getFullYear(); y++) out.push({label:String(y).slice(2), v: by[y] ? avg(by[y]) : null, title:String(y)}); }
  return out;
}

  if (vals.length) h += `<div class="card"><div class="statgrid"><div><div class="k muted">Lowest</div><div class="mid">${fmtMetric(k, Math.min(...vals))}</div></div><div><div class="k muted">Highest</div><div class="mid">${fmtMetric(k, Math.max(...vals))}</div></div></div></div>`;
  if (k === "move") { const t = TODAY(), r = ringsFor(t); h += `<div class="card"><div class="sub">Move goal ${num(r.moveGoal)} kcal · Exercise ${num(r.exerciseGoal)} min · Stand ${num(r.standGoal)} hrs. Goals come from your Apple Watch.</div></div>`; }
  if (k === "sleep") { const l = latest("sleep"); if (l) { const sl = S.days[l.k].sleep; h += sleepCard(sl, l.k); } }
  const ty = typical(k); if (ty.lo != null && m.agg === "avg") h += `<div class="card"><div class="between"><span class="muted">Your typical range</span><span class="mid" style="font-size:18px">${fmtPlain(k, ty.lo)} – ${fmtPlain(k, ty.hi)}</span></div><div class="sub">Based on your last 4 weeks</div></div>`;
  if (ABOUT[k]) h += `<h2>About ${esc(m.short || m.n)}</h2><div class="card"><div style="font-size:15px;line-height:1.5;color:rgba(235,235,245,.85)">${ABOUT[k]}</div></div>`;
  window._mb = {k, b, lbl};
  return h;
}
function bindCharts(){
  document.querySelectorAll("svg[data-tap]").forEach(svg => svg.addEventListener("click", e => {
    const i = e.target.getAttribute("data-i"); if (i == null || !window._mb) return; const {k, b} = window._mb; const it = b[+i]; const m = METRICS[k];
    svg.querySelectorAll("rect.bar").forEach(r => r.setAttribute("opacity", r.getAttribute("data-i")===i ? "1" : ".35"));
    $("#mhead").innerHTML = `<div class="eyebrow">${m.agg==="sum" && b.length > 30 ? "Average per day" : m.agg==="sum" ? "Total" : "Average"}</div><div class="big" style="color:${m.c}">${fmtMetric(k, it.v)}</div><div class="sub">${esc(it.title)}</div>`;
  }));
}

/* ----- Gym */
function sessionCard(ss){
  const groups = {}; for (const s of ss.sets) groups[groupOf(s.ex)] = (groups[groupOf(s.ex)]||0) + 1;
  return `<div class="card tap" onclick="go({t:'session',date:'${ss.date}'})"><div class="between"><div class="row">${iconBubble("strength")}
    <div><div style="font-size:15px;font-weight:600">${relDay(ss.date)}</div><div class="mid" style="color:var(--gym)">${ss.sets.length}<span class="u">sets</span> · ${ss.ex.length}<span class="u">exercises</span></div></div></div><span class="chev muted">›</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${Object.entries(groups).map(([g,n]) => `<span class="pill" style="color:${GROUP_COLORS[g]};background:${GROUP_COLORS[g]}22">${esc(g)} · ${n}</span>`).join("")}</div></div>`;
}
function vGym(){
  let h = topBar("Strength training", "Gym");
  const ss = sessions();
  h += `<button class="btn primary" style="margin:0 0 6px" onclick="go({t:'addset'})">+ Add a set manually</button>`;
  if (!ss.length) return h + `<div class="card empty">No sets yet.<br>Log sets from your Apple Watch with the “Log set” shortcut, then tap Sync.</div>`;
  // weekly volume, last 8 weeks
  const t = TODAY(), monday = addDays(t, -((pday(t).getDay()+6)%7));
  const weeks = []; for (let i = 7; i >= 0; i--) { const ws = addDays(monday, -7*i), we = addDays(ws, 6);
    const sets = setsList().filter(s => s.date >= ws && s.date <= we); weeks.push({label: pday(ws).toLocaleDateString("en-GB",{day:"numeric",month:"numeric"}), v: sets.length, sets}); }
  const thisWeek = weeks[weeks.length-1].sets;
  h += `<h2><span class="h2l">This Week${infoBtn("gymvol")}</span></h2><div class="card"><div class="statgrid">
    <div><div class="k muted">Sessions</div><div class="big" style="color:var(--gym)">${new Set(thisWeek.map(s=>s.date)).size}</div></div>
    <div><div class="k muted">Sets</div><div class="big" style="color:var(--gym)">${thisWeek.length}</div></div>
    <div><div class="k muted">Volume</div><div class="mid">${num(sum(thisWeek.map(s=>TIMED.has(s.ex)?0:s.reps*(s.kg||0))))}<span class="u">kg</span></div></div>
    <div><div class="k muted">Reps</div><div class="mid">${num(sum(thisWeek.map(s=>TIMED.has(s.ex)?0:s.reps)))}</div></div></div>
    <div style="margin-top:12px">${barChart(weeks, "#30d158", {h:110})}</div><div class="sub">Sets per week</div></div>`;
  // muscle groups (last 4 weeks)
  const since = addDays(t, -27), by = {};
  for (const s of setsList().filter(s => s.date >= since)) by[groupOf(s.ex)] = (by[groupOf(s.ex)]||0) + 1;
  const mxg = Math.max(1, ...Object.values(by));
  h += `<h2>Muscle Groups <small style="color:var(--label2)">4 weeks</small></h2><div class="card">${Object.keys(GROUP_COLORS).filter(g => by[g]).sort((a,b)=>by[b]-by[a]).map(g =>
    `<div class="zone" style="grid-template-columns:96px 1fr 40px"><div style="color:${GROUP_COLORS[g]};font-weight:600">${esc(g)}</div><div class="bar"><i style="width:${by[g]/mxg*100}%;background:${GROUP_COLORS[g]}"></i></div><div style="text-align:right;font-family:var(--round);font-weight:600">${by[g]}</div></div>`).join("") || `<div class="empty">No sets in the last 4 weeks</div>`}</div>`;
  // personal bests
  const best = {}; for (const s of setsList()) { const e = e1rm(s); const key = s.ex;
    const score = e ?? (TIMED.has(s.ex) ? s.reps : s.reps); const kind = e ? "kg" : TIMED.has(s.ex) ? "s" : "reps";
    if (!best[key] || score > best[key].score) best[key] = {score, kind, s}; }
  const pbs = Object.entries(best).sort((a,b) => a[0].localeCompare(b[0], "fr"));
  h += `<h2>Exercises</h2><div class="card list">${pbs.map(([ex, b]) => `<div class="item tap" onclick="go({t:'exercise',ex:${esc(JSON.stringify(ex))}})">
    <div style="width:10px;height:10px;border-radius:3px;background:${GROUP_COLORS[groupOf(ex)]}"></div><div style="flex:1"><div style="font-size:15px;font-weight:600">${esc(ex)}</div><div class="sub">${esc(groupOf(ex))}</div></div>
    <div style="text-align:right"><div class="mid" style="font-size:17px">${b.kind==="kg" ? `${num(b.s.kg,1)}<span class="u">kg</span> × ${b.s.reps}` : b.kind==="s" ? `${num(b.s.reps)}<span class="u">s</span>` : `${num(b.s.reps)}<span class="u">reps</span>`}</div><div class="sub">best set</div></div></div>`).join("")}</div>`;
  h += `<h2>Sessions</h2>` + ss.slice(0, 30).map(sessionCard).join("");
  return h;
}
function setLabel(s){ return TIMED.has(s.ex) ? `${num(s.reps)} s` : s.kg ? `${num(s.reps)} × ${num(s.kg,s.kg%1?1:0)} kg` : `${num(s.reps)} reps`; }
function vSession({date}){
  const ss = sessions().find(x => x.date === date); if (!ss) return navBar("") + `<div class="empty">This session has no sets left.</div>`;
  let h = navBar("") + `<div class="row" style="margin:6px 0 16px">${iconBubble("strength",56)}<div><div style="font-size:22px;font-weight:700">Strength Session</div><div class="sub">${fmtDate(date)}</div></div></div>`;
  h += `<div class="card"><div class="statgrid"><div><div class="k">Sets</div><div class="mid" style="color:var(--gym)">${ss.sets.length}</div></div>
    <div><div class="k">Exercises</div><div class="mid" style="color:var(--gym)">${ss.ex.length}</div></div>
    <div><div class="k">Volume</div><div class="mid">${num(ss.vol)}<span class="u">kg</span></div></div><div><div class="k">Reps</div><div class="mid">${num(ss.reps)}</div></div>
    ${metricVal("sleep", date) != null ? `<div><div class="k">Sleep the Night Before</div><div class="mid" style="color:var(--sleep)">${hm(metricVal("sleep", date)*60)}</div></div>` : ""}
    ${metricVal("hrv", date) != null ? `<div><div class="k">HRV That Morning</div><div class="mid" style="color:var(--heart)">${num(metricVal("hrv", date))}<span class="u">ms</span></div></div>` : ""}
    ${ss.workout ? `<div><div class="k">Workout Time</div><div class="mid" style="color:var(--time)">${clock((ss.workout.durationMin||0)*60)}</div></div><div><div class="k">Avg. Heart Rate</div><div class="mid" style="color:var(--heart)">${num(ss.workout.avgHr)}<span class="u">bpm</span></div></div>` : ""}</div>
    ${ss.workout ? `<div class="sub tap" style="margin-top:10px;color:var(--blue)" onclick="go({t:'workout',id:'${esc(ss.workout.id)}'})">Open Watch workout ›</div>` : ""}</div>`;
  for (const e of ss.ex) {
    h += `<div class="card"><div class="between"><div class="tap" onclick="go({t:'exercise',ex:${esc(JSON.stringify(e.ex))}})"><div style="font-weight:600">${esc(e.ex)}</div><div class="sub" style="color:${GROUP_COLORS[groupOf(e.ex)]}">${esc(groupOf(e.ex))}</div></div><span class="pill">${e.sets.length} sets</span></div>
      ${e.sets.map((s,i) => `<div class="setrow"><span class="muted">Set ${i+1}</span><span><b style="font-family:var(--round)">${setLabel(s)}</b><button class="del" onclick="delSet('${esc(s.id)}')">Delete</button></span></div>`).join("")}</div>`;
  }
  return h;
}
function delSet(id){ if (!confirm("Delete this set?")) return; S.deletedSets[id] = 1; delete S.sets[id]; save(); render(); }
function vExercise({ex}){
  const list = setsList().filter(s => s.ex === ex).sort((a,b) => a.date.localeCompare(b.date));
  let h = navBar("") + `<h1 style="font-size:28px;margin:4px 0 2px">${esc(ex)}</h1><div class="sub" style="color:${GROUP_COLORS[groupOf(ex)]};margin-bottom:14px">${esc(groupOf(ex))}</div>`;
  const byDay = {}; for (const s of list) (byDay[s.date] ||= []).push(s);
  const days = Object.keys(byDay).sort(); const timed = TIMED.has(ex), weighted = list.some(s => s.kg > 0);
  const pts = days.map((d,i) => { const ss = byDay[d]; return {x:i, y: weighted ? Math.max(...ss.map(s => e1rm(s)||0)) : Math.max(...ss.map(s=>s.reps)), label: pday(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}; });
  h += `<div class="card"><div class="eyebrow">${weighted ? "Estimated 1-rep max" : timed ? "Best hold" : "Best set"}</div><div class="big" style="color:var(--gym)">${pts.length ? num(Math.max(...pts.map(p=>p.y)), weighted?1:0) : "–"}<span class="u">${weighted?"kg":timed?"s":"reps"}</span></div>
    ${pts.length > 1 ? lineChart(pts, "#30d158", {h:160, dots:true, xLabels:[pts[0], pts[pts.length-1]].map(p=>({x:p.x,label:p.label}))}) : `<div class="sub" style="margin-top:6px">Log this exercise on another day to see your progress curve.</div>`}</div>`;
  h += `<h2>History</h2>` + days.slice().reverse().map(d => `<div class="card"><div class="between"><b>${relDay(d)}</b><span class="sub">${byDay[d].length} sets</span></div>${byDay[d].map((s,i)=>`<div class="setrow"><span class="muted">Set ${i+1}</span><b style="font-family:var(--round)">${setLabel(s)}</b></div>`).join("")}</div>`).join("");
  return h;
}
function vAddSet(){
  const groups = Object.keys(EXERCISES);
  return navBar("Add Set") + `<div class="card" style="margin-top:10px">
    <div class="field"><span>Date</span><input type="date" id="as-date" value="${TODAY()}"></div>
    <div class="field"><span>Group</span><select id="as-group" onchange="document.getElementById('as-ex').innerHTML=EXERCISES[this.value].map(e=>'<option>'+esc(e)+'</option>').join('')">${groups.map(g=>`<option>${esc(g)}</option>`).join("")}</select></div>
    <div class="field"><span>Exercise</span><select id="as-ex">${EXERCISES[groups[0]].map(e=>`<option>${esc(e)}</option>`).join("")}</select></div>
    <div class="field"><span>Reps (or seconds)</span><input type="number" inputmode="decimal" id="as-reps" placeholder="10"></div>
    <div class="field"><span>Weight (kg)</span><input type="number" inputmode="decimal" id="as-kg" placeholder="0 = bodyweight"></div>
    <div class="field"><span>Number of sets</span><input type="number" inputmode="numeric" id="as-n" value="1"></div>
    <div id="as-err" class="sub" style="color:var(--heart)"></div></div>
    <button class="btn primary" onclick="addSet()">Save</button>`;
}
function addSet(){
  const reps = parseFloat($("#as-reps").value), kg = parseFloat($("#as-kg").value||"0"), n = Math.max(1, Math.min(20, parseInt($("#as-n").value||"1"))), date = $("#as-date").value, ex = $("#as-ex").value;
  if (!(reps > 0)) { $("#as-err").textContent = "Enter the number of reps (or seconds) first."; return; }
  if (!date) { $("#as-err").textContent = "Pick a date."; return; }
  for (let i = 0; i < n; i++) { const id = "m|" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); S.sets[id] = {id, src:"manual", date, time:new Date().toISOString(), ex, reps, kg: isNaN(kg)?0:kg}; }
  save(); toast(`${n} set${n>1?"s":""} saved`); back();
}

/* ----- Health */
function sleepCard(sl, k){
  if (!sl) return "";
  const st = ["awake","rem","core","deep"].filter(s => sl[s]);
  return `<div class="card"><div class="between"><div><div class="eyebrow">Time asleep · ${relDay(k)}</div><div class="big" style="color:var(--sleep)">${hm(sl.asleepMin || sl.inBed)}</div></div><div class="sub">${timeOf(sl.start)} – ${timeOf(sl.end)}</div></div>
    <div style="margin-top:10px">${hypnogram(sl)}</div>
    ${st.length ? `<div class="statgrid" style="margin-top:10px;grid-template-columns:repeat(4,1fr)">${st.map(s => `<div><div class="sub" style="color:${STAGE[s].c};font-weight:600">${STAGE[s].n}</div><div style="font-family:var(--round);font-weight:600">${hmPlain(sl[s])}</div></div>`).join("")}</div>` : ""}</div>`;
}
function metricRow(k, within=3650){
  const l = latest(k, within); if (!l) return ""; const m = METRICS[k];
  const s = series(k, 30).filter(x=>x.v!=null);
  return `<div class="card tap" onclick="go({t:'metric',k:'${k}'})"><div class="ct"><span style="color:${m.c}">${esc(m.n)}</span><span class="chev">${relDay(l.k)} ›</span></div>
    <div class="between" style="align-items:flex-end"><div class="big" style="margin-top:6px">${fmtMetric(k, l.v)}</div>
    <div style="width:46%">${s.length > 1 ? lineChart(s.map((x,i)=>({x:i,y:x.v})), m.hex, {h:56, area:true}).replace(/<text[^>]*>[^<]*<\/text>/g,"") : ""}</div></div></div>`;
}
function vHealth(){
  let h = topBar("Recovery and vitals", "Health");
  if (!Object.keys(S.days).length) return h + welcome();
  const ls = latest("sleep");
  h += vitalsCard();
  h += `<h2>Sleep</h2>` + (ls ? sleepCard(S.days[ls.k].sleep, ls.k) + `<div class="card tap" onclick="go({t:'metric',k:'sleep'})"><div class="ct"><span style="color:var(--sleep)">Last 14 nights</span><span class="chev">›</span></div>${barChart(series("sleep",14).map(x=>({label:pday(x.k).toLocaleDateString("en-GB",{weekday:"narrow"}),v:x.v})), "#5ac8fa", {h:110, goal:8})}</div>`
    : `<div class="card empty">Wear your Apple Watch to bed with a sleep schedule set up to see your sleep here.</div>`);
  h += `<h2>Heart</h2>` + metricRow("rhr") + metricRow("hrv") + metricRow("walkHr") + (metricRow("vo2") || `<div class="card"><div class="ct" style="color:var(--heart)">Cardio Fitness (VO₂ max)</div><div class="sub" style="margin-top:4px">Your Watch estimates this after outdoor walks or runs with GPS. It usually appears within a few days.</div></div>`);
  h += `<h2>Breathing</h2>` + (metricRow("respRate") || `<div class="card sub">Respiratory rate is measured while you sleep.</div>`);
  h += `<h2>Body</h2>` + metricRow("weight");
  h += `<h2>Activity</h2>` + metricRow("steps") + metricRow("distKm") + metricRow("flights") + metricRow("daylightMin");
  h += `<h2>Mobility</h2>` + metricRow("walkSpeed") + metricRow("stepLenCm");
  return h;
}

/* ----- Settings */
function vSettings(){
  const p = S.profile, st = S.settings, nDays = Object.keys(S.days).length;
  const sizeKB = Math.round(JSON.stringify(S).length / 1024);
  return navBar("Settings") + `
  <h2>Sync</h2><div class="card">
    <div class="between"><span>Last sync</span><span class="muted">${S.meta.lastSync ? new Date(S.meta.lastSync).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "Never"}</span></div>
    <button class="btn primary" onclick="syncNow()">Sync now</button>
    <div class="sub" style="margin-top:8px">Runs the “${SHORTCUT_NAME}” shortcut on your iPhone, which reads Apple Health and your gym log and brings the new data back here.</div></div>
  <h2>Profile</h2><div class="card">
    <div class="field"><span>Date of birth</span><input type="date" value="${esc(p.dob||"")}" onchange="S.profile.dob=this.value;save();render()"></div>
    <div class="field"><span>Height (cm)</span><input type="number" inputmode="decimal" value="${esc(p.heightCm||"")}" onchange="S.profile.heightCm=+this.value;save()"></div>
    <div class="field"><span>Max heart rate</span><input type="number" inputmode="numeric" placeholder="${maxHr()} (estimated)" value="${esc(st.maxHr||"")}" onchange="S.settings.maxHr=+this.value||undefined;save();render()"></div>
    <div class="field"><span>Resting heart rate</span><input type="number" inputmode="numeric" placeholder="${restHr()} (from Watch)" value="${esc(st.restHr||"")}" onchange="S.settings.restHr=+this.value||undefined;save();render()"></div>
    <div class="sub">Max and resting heart rate set your heart-rate zones. Leave them empty to use estimates.</div></div>
  <h2>Data</h2><div class="card">
    <div class="between"><span>Stored on this device</span><span class="muted">${num(nDays)} days · ${Object.keys(S.workouts).length} workouts · ${setsList().length} sets · ${sizeKB} KB</span></div>
    <button class="btn" onclick="$('#file').click()">Import file…</button>
    <button class="btn" onclick="pasteImport()">Paste from clipboard</button>
    <button class="btn" onclick="backup()">Save backup file</button>
    <div class="sub" style="margin-top:8px">Last backup: ${S.meta.lastBackup ? new Date(S.meta.lastBackup).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "never"}. Save backups to iCloud Drive › Sport › Dashboard › Backups. To restore, import a backup file.</div></div>
  <h2>About</h2><div class="card"><div class="row" style="margin-bottom:10px"><img src="${LOGO}" alt="" width="34"><div><div style="font-weight:700">Biom</div><div class="sub">Version ${APP_VERSION}</div></div></div><div class="sub"> Your data never leaves this device: there is no server and no account. Not a medical device.</div>
    <button class="btn danger" onclick="wipe()">Delete all data on this device</button></div>`;
}
async function pasteImport(){ try { const t = await navigator.clipboard.readText(); toast(importText(t, "Pasted")); render(); } catch(e) { toast("Couldn't read the clipboard: " + esc(e.message)); } }
async function wipe(){ if (!confirm("Delete all data stored in Biom on this device? Make a backup first if you want to keep it.")) return; S = blankState(); await dbSet("state", S); R.stack = []; render(); toast("All data deleted"); }

/* ============================================================ start */
$("#file").addEventListener("change", e => { handleFiles([...e.target.files]); e.target.value = ""; });
window.addEventListener("hashchange", () => { if (handleHash()) render(); });
(async function start(){
  await load();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  handleHash();
  render();
})();
</script>
</body>
</html>
